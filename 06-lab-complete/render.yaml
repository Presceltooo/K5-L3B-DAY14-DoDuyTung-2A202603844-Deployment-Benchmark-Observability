services:
  - type: web
    name: ai-agent-production
    runtime: docker
    region: singapore
    plan: free
    rootDir: 06-lab-complete
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: LOG_LEVEL
        value: INFO
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-agent-redis
          property: connectionString

  - type: redis
    name: ai-agent-redis
    region: singapore
    plan: free
    ipAllowList: []
